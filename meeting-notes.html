<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCCA Board Meeting Minutes</title>
  <!-- Load Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white m-0 p-0 text-slate-800 antialiased">

  <!-- Main Dashboard Container (Fills 100% width of the iframe seamlessy) -->
  <div class="w-full font-sans border border-slate-200 rounded-xl bg-white overflow-hidden">

    <!-- Header Banner -->
    <div class="bg-slate-800 text-white p-5 border-b border-slate-700">
      <h2 class="text-xl font-bold tracking-wide">SCCA Board Meeting Minutes</h2>
      <p class="text-xs text-slate-300 mt-1">Select a meeting date from the list to view the official notes.</p>
    </div>

    <!-- Main Dashboard Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 min-h-[500px]">

      <!-- LEFT PANEL: Sidebar Navigation -->
      <div
        class="md:col-span-4 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50 overflow-y-auto max-h-[300px] md:max-h-[580px]">
        <div
          class="p-3 bg-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider sticky top-0 border-b border-slate-200">
          Meeting Dates
        </div>
        <nav id="date-list" class="divide-y divide-slate-100">
          <!-- Buttons injected here by JS -->
        </nav>
      </div>

      <!-- RIGHT PANEL: Note Reader Pane -->
      <div class="md:col-span-8 p-6 md:p-8 bg-white flex flex-col justify-between max-h-[580px] overflow-y-auto">
        <div id="notes-content">
          <!-- Active content injected here by JS -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // Hardcoded Meeting Data Archive
    const meetingArchive = [
      {
        id: "2026-06-04",
        dateLabel: "June 4, 2026",
        participants: "Tyler Schulmeister, Mary Kuhn, Jen Edwards, Ike Eichenlaub, Rebecca Blashack",
        content: `Three SCCA households brought dead trees to Jim and Ike’s attention. Jim and Ike are scheduled to assess the trees with a tree removal company on Tuesday, June 9.

A member of the SCCA community requested SCCA budget information and meeting minutes. The group agreed it’s in the community’s interest to make this information available. Ike will send meeting minutes to Tyler to post on the SCCA website. Budget information is already available in the annual newsletter.

Ike provided an update on SCCA’s efforts to establish a Special Taxing District for purposes of collecting dues. Ike last heard from Lori Blair, Deputy County Attorney, on the matter on April 21, at which time she indicated she was reviewing our request and would get back to Ike. She has not provided further information. Ike called Ms. Blair on Tuesday, June 2, and left a message; she has not responded. Ike will contact Council Member Fiedler on Monday, June 8, to ask for her support and intervention.

Rebecca informed the group she does not intend to serve as SCCA treasurer beyond her current term. The Board thanks Rebecca and is VERY sorry to see her leave the Board.`
      },
      {
        id: "2026-04-30",
        dateLabel: "April 30, 2026",
        participants: "Dan Giles, Tyler Schulmeister, Mary Kuhn, Jen Edwards, Ed Maddox, Ike Eichenlaub",
        content: `The Board agreed to send a letter to a SCCA community member, thanking him for his efforts on common area maintenance and stating he must contact the Board prior to making any changes on SCCA property.

The Board agreed to pay annual dues for membership in the Growth Action Network. The Board agreed not to pursue Pete Foley’s proposal to install cameras at the entrances to the neighborhood to monitor cars for crime prevention.`
      },
      {
        id: "2026-02-19",
        dateLabel: "February 19, 2026",
        participants: "Dan Giles, Neda Newnam, Tyler Schulmeister, Mary Kuhn, Jen Edwards, Ed Maddox, Ike Eichenlaub, Rebecca Blashack, Jim Guilfoyle",
        content: `Ike updated the group on the special taxing district initiative. He informed them he submitted documents to the County’s STD coordinator who in turn submitted our request to the County’s Law Office for review.

The Board voted in favor of regularly scheduled meetings to occur the first Thursday of every other month at 7:00 p.m., and agreed to schedule ad hoc meetings more frequently as needed.

There were no problems signing in to Google Meet for SCCA Board meeting purposes.

Mary and Jen mentioned the community has inquired about when the new traffic light will be activated and whether or not the crossing guard will remain after the light is activated. Ike has been posting information from the County’s project manager on SCCA’s website and Shipley’s Choice Facebook page.`
      },
      {
        id: "2025-12-11",
        dateLabel: "December 11, 2025",
        participants: "Jim Guilfoyle, Dan Giles, Neda Newnam, John Norville, Tyler Schulmeister, Mary Kuhn, Jen Edwards, Ed Maddox, Ike Eichenlaub, Rebecca Blashack",
        content: `The Board voted 9 to 1 in favor of pursuing a Special Community Benefits District for purposes of dues collection. Ike, Jim, Rebecca and Jen will serve on a committee to coordinate the application to the County.

Mary continues to submit paperwork for a playground grant from the County.`
      }
    ];

    const dateListContainer = document.getElementById('date-list');
    const notesContentContainer = document.getElementById('notes-content');

    function displayNotes(meeting) {
      notesContentContainer.innerHTML = `
        <div class="animate-fadeIn">
          <h3 class="text-2xl font-bold text-slate-800 tracking-tight">${meeting.dateLabel}</h3>
          
          <div class="mt-4 p-3 bg-slate-50 border border-slate-100 rounded-lg text-sm text-slate-600">
            <span class="font-semibold text-slate-700">Attendees:</span> ${meeting.participants}
          </div>
          
          <div class="mt-6 text-base text-slate-700 leading-relaxed whitespace-pre-line space-y-4">
            ${meeting.content}
          </div>
        </div>
      `;

      notesContentContainer.firstElementChild.style.opacity = 0;
      notesContentContainer.firstElementChild.style.transition = 'opacity 0.15s ease-in-out';
      setTimeout(() => notesContentContainer.firstElementChild.style.opacity = 1, 10);
    }

    function updateActiveButtonStyle(activeId) {
      meetingArchive.forEach(meeting => {
        const btn = document.getElementById(`btn-${meeting.id}`);
        if (meeting.id === activeId) {
          btn.className = "w-full text-left p-4 bg-blue-50 text-blue-700 font-semibold border-l-4 border-blue-600 focus:outline-none transition-all duration-150";
        } else {
          btn.className = "w-full text-left p-4 text-slate-700 hover:bg-slate-100 font-medium border-l-4 border-transparent focus:outline-none transition-all duration-150";
        }
      });
    }

    function initializeDashboard() {
      meetingArchive.forEach((meeting) => {
        const button = document.createElement('button');
        button.id = `btn-${meeting.id}`;
        button.innerText = meeting.dateLabel;

        button.addEventListener('click', () => {
          displayNotes(meeting);
          updateActiveButtonStyle(meeting.id);
        });

        dateListContainer.appendChild(button);
      });

      if (meetingArchive.length > 0) {
        displayNotes(meetingArchive[0]);
        updateActiveButtonStyle(meetingArchive[0].id);
      }
    }

    initializeDashboard();
  </script>
</body>

</html>
